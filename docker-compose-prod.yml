services:
  app:
    build:
      context: .
      dockerfile: docker/alpine/Dockerfile
    image: erugo-local:security
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ${ERUGO_STORAGE_PATH:-./erugo-storage}:/var/www/html/storage
    ports:
      - "${APP_PORT:-9998}:80"
