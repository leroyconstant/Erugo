name: Security and compatibility

on:
  push:
    branches: [main, 'codex/security-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3.36', '8.4.27']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, curl, sodium
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked
      - run: vendor/bin/phpunit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose
        run: docker compose -f docker-compose-prod.yml config --quiet
      - name: Build production image from the fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          load: true
          tags: erugo-security:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify actual runtime and upload-progress protection
        run: |
          docker run --rm --entrypoint php erugo-security:test -r '
            if (version_compare(PHP_VERSION, "8.3.36", "<") || ini_get("session.upload_progress.enabled")) {
              fwrite(STDERR, "Unsafe PHP runtime or upload-progress configuration\n");
              exit(1);
            }
            echo PHP_VERSION, "\n";
          '
      - name: Start application with a fresh disposable database
        run: |
          docker run -d --name erugo-security -p 127.0.0.1:9998:80 \
            -e APP_ENV=production -e APP_DEBUG=false erugo-security:test
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' erugo-security)" != true ]; then
              docker logs erugo-security
              exit 1
            fi
            if curl --max-time 5 -fsS http://127.0.0.1:9998/api/health; then
              curl --max-time 5 -fsS http://127.0.0.1:9998/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs erugo-security
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs erugo-security || true
      - name: Cleanup
        if: always()
        run: docker rm -f erugo-security || true

  publish:
    name: Publish GHCR image
    needs: [php, container]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Erugo
            org.opencontainers.image.description=Erugo with patched PHP and updated dependencies
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=sha-${{ github.sha }}
          cache-from: type=gha,scope=ghcr
          cache-to: type=gha,scope=ghcr,mode=max
      - name: Verify published manifest
        run: docker buildx imagetools inspect ghcr.io/leroyconstant/erugo@${{ steps.build.outputs.digest }}
